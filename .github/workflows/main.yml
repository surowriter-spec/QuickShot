name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Unzip project
        run: unzip -o QuickShot.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Get Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: QuickShot
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            grep -E "error:|What went wrong|^>|e: " build.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: QuickShot-apk
          path: QuickShot/app/build/outputs/apk/debug/app-debug.apk
